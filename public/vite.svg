  <!-- RC Monogram in bold structural typography -->
  <text x="13" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="27" font-weight="900" fill="#ffffff">R</text>
  <text x="32" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="27" font-weight="900" fill="#38bdf8">C</text>
